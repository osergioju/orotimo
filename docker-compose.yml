services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orotimo
      POSTGRES_PASSWORD: orotimo
      POSTGRES_DB: orotimo
    ports:
      - '5433:5432'
    volumes:
      - orotimo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orotimo -d orotimo']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orotimo-db-data:
